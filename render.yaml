services:
  - type: web
    name: kanteisho
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: KANTEISHO_ACCESS_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_HOURS
        value: 12
      - key: MEMBER_SESSION_HOURS
        value: 24
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_APP_URL
        value: https://kanteisho.onrender.com
      - key: PAYPAL_STUDENT_GRADUATE_PRODUCT_ID
        value: KANTEISHO-STUDENT-GRADUATE
      - key: PAYPAL_STUDENT_GRADUATE_PLAN_ID
        value: P-39272220BU229050SNLEP5DQ
      - key: PAYPAL_STUDENT_GRADUATE_PURCHASE_URL
        sync: false
      - key: PAYPAL_STUDENT_GRADUATE_SALES_ENABLED
        value: "false"
      - key: PAYPAL_GRADUATE_STUDY_PRODUCT_ID
        value: SUIMEI-STUDY-ONLY-GRADUATE
      - key: PAYPAL_GRADUATE_STUDY_PLAN_ID
        value: P-7SG54334UB939783ENLSWWRY
      - key: PAYPAL_GRADUATE_STUDY_PURCHASE_URL
        value: https://www.paypal.com/webapps/billing/plans/subscribe?plan_id=P-7SG54334UB939783ENLSWWRY
      - key: PAYPAL_GRADUATE_STUDY_SALES_ENABLED
        value: "false"
      - key: PAYPAL_GRADUATE_STUDY_ADDON_PRODUCT_ID
        value: SUIMEI-STUDY-ADDON-GRADUATE
      - key: PAYPAL_GRADUATE_STUDY_ADDON_PLAN_ID
        value: P-09M04819MN506452HNLSWV5Q
      - key: PAYPAL_GRADUATE_STUDY_ADDON_PURCHASE_URL
        value: https://www.paypal.com/webapps/billing/plans/subscribe?plan_id=P-09M04819MN506452HNLSWV5Q
      - key: PAYPAL_GRADUATE_STUDY_ADDON_SALES_ENABLED
        value: "false"
      - key: PAYPAL_REFERRAL_PRODUCT_ID
        value: KANTEISHO-REFERRAL
