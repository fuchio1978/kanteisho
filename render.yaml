        sync: false
      - key: STORES_REFERRAL_ITEM_ID
        sync: false
      - key: STORES_STUDENT_GRADUATE_ITEM_ID
        sync: false
      - key: STORES_GRADUATE_STUDY_ITEM_ID
        sync: false
      - key: STORES_GRADUATE_BUNDLE_ITEM_ID
        sync: false
      - key: STORES_GRADUATE_STUDY_ADDON_ITEM_ID
