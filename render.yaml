services:
  - type: web
    name: kanteisho
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: KANTEISHO_ACCESS_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_HOURS
        value: 12
      - key: MEMBER_SESSION_HOURS
        value: 24
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_APP_URL
        value: https://kanteisho.onrender.com
      - key: STORES_STARTER_ITEM_ID
        value: 6a7db1d62ca89ea7083f4a47
      - key: STORES_PREMIUM_ITEM_ID
        value: 6a7db23545021ca086e1450b
      - key: STORES_STUDENT_ITEM_ID
        value: 6a7db2db82a509a1ac820316
      - key: STORES_REFERRAL_ITEM_ID
        value: 6a7db31e45021cb239e144b2
