services:
  - type: web
    name: kanteisho
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: KANTEISHO_ACCESS_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_HOURS
        value: 12
      - key: MEMBER_SESSION_HOURS
        value: 24
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PUBLIC_APP_URL
        value: https://kanteisho.onrender.com
      - key: STORES_STARTER_ITEM_ID
        sync: false
      - key: STORES_PREMIUM_ITEM_ID
        sync: false
      - key: STORES_REFERRAL_ITEM_ID
        sync: false
      - key: STORES_STUDENT_GRADUATE_ITEM_ID
        sync: false
      - key: STORES_GRADUATE_STUDY_ITEM_ID
        sync: false
      - key: STORES_GRADUATE_BUNDLE_ITEM_ID
        sync: false
      - key: STORES_GRADUATE_STUDY_ADDON_ITEM_ID
        sync: false
      - key: STORES_STARTER_SALES_ENABLED
        value: "false"
      - key: STORES_PREMIUM_SALES_ENABLED
        value: "false"
      - key: STORES_REFERRAL_SALES_ENABLED
        value: "false"
      - key: STORES_STUDENT_GRADUATE_SALES_ENABLED
        value: "false"
      - key: STORES_GRADUATE_STUDY_SALES_ENABLED
        value: "false"
      - key: STORES_GRADUATE_BUNDLE_SALES_ENABLED
        value: "false"
      - key: STORES_GRADUATE_STUDY_ADDON_SALES_ENABLED
        value: "false"
